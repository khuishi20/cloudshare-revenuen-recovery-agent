#spring.application.name=cloudshare
#spring.data.mongodb.uri=mongodb://admin:admin@localhost:27017/cloudshare?directConnection=true&serverSelectionTimeoutMS=5000


#spring.data.mongodb.uri=mongodb://localhost:27017/cloudshare
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=cloudshare

server.servlet.context-path=/api/v1
spring.data.mongodb.auto-index-creation=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
clerk.issuer=https://advanced-mosquito-50.clerk.accounts.dev
clerk.jwks-url=https://advanced-mosquito-50.clerk.accounts.dev/.well-known/jwks.json
clerk.webhook.secret=${CLERK_WEBHOOK_SECRET}

#file configuration
#spring.servlet.multipart.location=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Revenue Recovery agent service
agent.service.url=${AGENT_SERVICE_URL:http://127.0.0.1:8123}